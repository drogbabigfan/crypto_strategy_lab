# Blueprint v4.6 Configuration
# Deep Learning + Reinforcement Learning Bitcoin Trading Strategy

experiment_name: "dollarbar_patchtst_v4.6"

# ============================================================
# DATA CONFIGURATION
# ============================================================
data:
  base_dir: "./data"

  # Multi-Asset Configuration (7 assets)
  assets:
    foundation:  # SSL Pre-training용 (모든 자산)
      - { symbol: "BTCUSDT", market: "futures", priority: 1 }
      - { symbol: "ETHUSDT", market: "futures", priority: 1 }
      - { symbol: "XRPUSDT", market: "futures", priority: 2 }
      - { symbol: "SOLUSDT", market: "futures", priority: 2 }
      - { symbol: "BNBUSDT", market: "futures", priority: 2 }
      - { symbol: "DOGEUSDT", market: "futures", priority: 3 }
      - { symbol: "LTCUSDT", market: "futures", priority: 3 }
    trading:  # 실제 Trading용
      - "BTCUSDT"

  # Directory Structure
  paths:
    raw: "raw"           # data/raw/{market}/{symbol}/
    bars: "bars"         # data/bars/{market}/{symbol}/
    features: "features" # data/features/{market}/{symbol}/
    labels: "labels"     # data/labels/{market}/{symbol}/
    state: "state"       # data/state/{market}/{symbol}/

  # Dollar Bar Configuration
  dollar_bar:
    target_bars_per_day: 50    # 약 29분 간격
    warmup_days: 14            # EMA 워밍업
    ema_span: 14               # Threshold = EMA_14(DailyDollarVolume) / 50

# ============================================================
# FEATURES CONFIGURATION (30개)
# ============================================================
features:
  # L1 Stateless Features (8개)
  l1_stateless:
    - "log_volume"
    - "log_tick_count"
    - "log_duration"
    - "log_trade_intensity"
    - "vwap_deviation"
    - "volume_imbalance"
    - "bar_range"
    - "bar_body"

  # Cyclical Time Features (4개)
  cyclical_time:
    - "sin_time"   # sin(2π × hour / 24)
    - "cos_time"   # cos(2π × hour / 24)
    - "sin_week"   # sin(2π × day_of_week / 7)
    - "cos_week"   # cos(2π × day_of_week / 7)

  # Regime Features (8개)
  regime:
    parkinson_window: 24
    entropy_window: 24
    entropy_bins: 10
    vol_halflife: 50
    entropy_halflife: 50
    outputs:
      - "garman_klass_vol"
      - "realized_vol"
      - "shannon_entropy"
      - "vol_ratio"
      - "vol_zscore"
      - "entropy_zscore"
      - "skewness"
      - "kurtosis"

  # Stationarity Features (3개)
  stationarity:
    frac_diff_d: 0.4
    frac_diff_thresh: 1e-5
    detrend_halflife: 100
    outputs:
      - "frac_diff_close"
      - "detrended_log_price"
      - "returns"

  # Momentum Features (5개)
  momentum:
    windows: [10, 50, 250, 1000]
    halflife: 50
    outputs:
      - "vw_momentum"
      - "momentum_zscore_10"
      - "momentum_zscore_50"
      - "momentum_zscore_250"
      - "momentum_zscore_1000"

  # Technical Indicators (2개)
  technical:
    - "connors_rsi"
    - "is_primed"   # Meta feature (boolean)

  # Total: 30 features

# ============================================================
# LABEL OPTIMIZER CONFIGURATION
# ============================================================
labeling:
  # Triple Barrier 기본 파라미터
  volatility_window: 24         # 바 단위 ATR window

  # Plateau Search Configuration
  plateau_search:
    enabled: true
    pt_range: [1.5, 3.0]        # PT multiplier 탐색 범위
    sl_range: [0.5, 2.0]        # SL multiplier 탐색 범위
    max_bars_range: [10, 50]    # Max holding period 탐색 범위

    grid_resolution: 20          # 각 축 탐색 해상도

    # Connected Component 기반 Plateau 추출
    plateau:
      percentile_threshold: 95   # 상위 5% Rank IC
      min_size_pct: 1.0          # 최소 plateau 크기 (전체의 1%)

    # 최종 파라미터 선택
    selection: "centroid"        # 가장 큰 connected component의 중심

  # Ordinal Label 생성 (K=5)
  ordinal_labels:
    num_classes: 5
    bins: "quantile"             # 동일 빈도 분할

# ============================================================
# SSL PRE-TRAINING CONFIGURATION
# ============================================================
ssl:
  # One-off Foundation Model
  one_off: true

  # Data Configuration
  data:
    assets: "foundation"         # 7개 자산 모두 사용
    n_features: 30
    context_window: 512
    min_samples: 30000           # 자산당 최소 샘플

  # Masking Strategy
  masking:
    strategy: "patch_random"     # Patch-wise Random Masking
    mask_ratio: 0.4              # 40% patches masked

  # Model Architecture (PatchTST)
  model:
    architecture: "PatchTST"
    patch_len: 16
    stride: 16
    d_model: 128
    n_heads: 4
    n_layers: 2
    dropout: 0.1

  # Training
  training:
    batch_size: 256
    epochs: 100
    learning_rate: 0.001
    weight_decay: 0.01
    warmup_epochs: 10
    early_stopping_patience: 10

  # Fail-Fast Policy
  fail_fast:
    check_epoch: 10
    min_loss_reduction: 0.05     # 5% 이상 loss 감소 필요

# ============================================================
# WFA (WALK-FORWARD ANALYSIS) CONFIGURATION
# ============================================================
wfa:
  # Fold Configuration
  n_folds: 5

  # Expanding Window (과거 전체 + 새 fold)
  window_type: "expanding"

  # 각 Fold별 Train/Val 분할
  train_val_split: 0.85          # 85% train, 15% val

  # Fine-tuning
  fine_tuning:
    epochs: 20
    learning_rate: 0.0001        # 10x lower than SSL
    freeze_encoder: false        # Encoder도 fine-tune

  # Ordinal Regression Head
  head:
    type: "ordinal"
    num_classes: 5
    hidden_dim: 64

# ============================================================
# MODEL ARCHITECTURE
# ============================================================
model:
  architecture: "PatchTST"

  # Input
  context_window: 512
  n_features: 30

  # Patching
  patch_len: 16
  stride: 16

  # Transformer
  d_model: 128
  n_heads: 4
  n_layers: 2
  d_ff: 512
  dropout: 0.1

  # Output
  num_classes: 5                 # Ordinal labels (K=5)

# ============================================================
# EXECUTION & COST MODEL
# ============================================================
execution:
  # Entry Timing
  entry_timing: "next_bar_open"  # Signal at t → Entry at t+1 Open

  # Square Root Cost Model
  cost_model:
    type: "square_root"
    # Impact = η × σ × √(Q/V)
    eta: 0.1                     # Market impact coefficient
    fee_rate: 0.0004             # 0.04% taker fee

  # Position Sizing
  position:
    risk_per_trade: 0.02         # 2% equity risk
    max_position_pct: 0.2        # Max 20% single position

  # Signal Threshold
  signal:
    long_threshold: 3            # Class 4-5: Long
    short_threshold: 2           # Class 1-2: Short
    neutral_range: [2, 3]        # Class 3: No trade

# ============================================================
# INFRASTRUCTURE
# ============================================================
infrastructure:
  # Logging
  logging:
    level: "INFO"
    tensorboard: true
    mlflow: false

  # Hardware
  hardware:
    device: "cuda"
    mixed_precision: true
    num_workers: 4

  # Checkpointing
  checkpoints:
    dir: "./checkpoints"
    save_best: true
    save_every_n_epochs: 5
